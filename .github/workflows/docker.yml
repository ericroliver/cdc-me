name: Docker Build and Push

permissions:
  contents: read
  actions: read
  security-events: write

on:
  push:
    branches: [main, develop, eo/setup-test-bed]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push to container registry"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_VERSION: "10.0.x"

jobs:
  # Build Information
  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-push: ${{ steps.push-decision.outputs.should-push }}
      is-pr: ${{ steps.build-type.outputs.is-pr }}
      platforms: ${{ steps.build-type.outputs.platforms }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Determine push decision
        id: push-decision
        run: |
          SHOULD_PUSH=false

          # Push on main branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            SHOULD_PUSH=true
          fi

          # Push on develop branch
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            SHOULD_PUSH=true
          fi

          # Push on eo/setup-test-bed branch
          if [[ "${{ github.ref }}" == "refs/heads/eo/setup-test-bed" ]]; then
            SHOULD_PUSH=true
          fi

          # Push on tags
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SHOULD_PUSH=true
          fi

          # Push on manual trigger
          if [[ "${{ inputs.push_to_registry }}" == "true" ]]; then
            SHOULD_PUSH=true
          fi

          echo "should-push=$SHOULD_PUSH" >> $GITHUB_OUTPUT
          echo "Should push: $SHOULD_PUSH"

      - name: Determine build type and platforms
        id: build-type
        run: |
          IS_PR=false
          PLATFORMS="linux/amd64,linux/arm64"
          
          # Check if this is a PR build
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IS_PR=true
            PLATFORMS="linux/amd64"
          fi
          
          echo "is-pr=$IS_PR" >> $GITHUB_OUTPUT
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "Is PR: $IS_PR"
          echo "Platforms: $PLATFORMS"

  # Docker Build and Push
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-info
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.build-info.outputs.should-push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build-info.outputs.version }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ needs.build-info.outputs.platforms }}
          push: ${{ needs.build-info.outputs.should-push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-info.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Generate SBOM
        if: needs.build-info.outputs.should-push == 'true'
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-info.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: needs.build-info.outputs.should-push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.spdx.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner
        if: needs.build-info.outputs.should-push == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-info.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        if: needs.build-info.outputs.should-push == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container-scan"
        continue-on-error: true


  # Test Docker Image
  test-docker:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: [build-info, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image for native platform
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cdc-api:test
          build-args: |
            VERSION=${{ needs.build-info.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha

      - name: Test Docker image - Health check endpoint
        run: |
          # Start the container in the background
          docker run -d --name cdc-api-test -p 8080:8080 cdc-api:test

          # Wait for the container to start
          sleep 10

          # Test health endpoint (if it exists)
          curl -f http://localhost:8080/health || echo "Health endpoint not available, testing root endpoint"

          # Test root endpoint
          curl -f http://localhost:8080/ || echo "Root endpoint test completed"

          # Stop and remove the container
          docker stop cdc-api-test
          docker rm cdc-api-test

      - name: Verify executable exists in container
        run: |
          docker run --rm --entrypoint="" cdc-api:test sh -c "ls -la /app/ && file /app/cdc-api.dll"

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-info, docker]
    if: needs.build-info.outputs.should-push == 'true'

    steps:
      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-info.outputs.version }}
          args: --severity-threshold=high
        continue-on-error: true

  # Summary
  docker-summary:
    name: Docker Build Summary
    runs-on: ubuntu-latest
    needs: [build-info, docker, test-docker]
    if: always()

    steps:
      - name: Docker Build Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.build-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Should Push**: ${{ needs.build-info.outputs.should-push }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Build**: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Test**: ${{ needs.test-docker.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build-info.outputs.should-push }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Container Registry" >> $GITHUB_STEP_SUMMARY
            echo "Image pushed to: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-info.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Pull Command" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Run Command" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker run -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
