# Docker Compose configuration for CDC Testing Framework
# SQL Server-only deployment — uses SQL Server for both the test database
# and the DTAI metadata database (factory tables, orders, etc.)
#
# This profile is for environments that do not have PostgreSQL DBA expertise.
# The API will auto-create the factory schema via DbUp on startup.

version: '3.8'

services:
  # CDC Testing Framework API
  cdc-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "10.0"
        VERSION: "${VERSION:-1.0.0}"
    image: cdc-api:${VERSION:-latest}
    container_name: cdc-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - TEST_DB_CONNECTION=${TEST_DB_CONNECTION}
      - CDCME_DB_CONNECTION=Server=sqlserver;Database=cdcme;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=true;
      - TEST_DB_PROVIDER=SqlServer
      - CDCME_DB_PROVIDER=SqlServer
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - cdc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SQL Server — hosts both the test database and the DTAI metadata database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cdc-sqlserver
    ports:
      - "${SQL_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=${SQL_PID:-Developer}
      - MSSQL_AGENT_ENABLED=true
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - cdc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlserver-data:
    driver: local

networks:
  cdc-network:
    driver: bridge