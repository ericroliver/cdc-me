name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "src/TokenUsageCollector/TokenUsageCollector.csproj"

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## Changes in ${{ steps.get_version.outputs.VERSION }}

            ### Features
            - Token usage collection for OpenAI and Anthropic providers
            - Cross-platform executables for Windows, macOS, and Linux
            - Configurable output formats and date ranges

            ### Downloads
            Choose the appropriate executable for your platform:
            - **Windows x64**: `token-usage-collector-win-x64.zip`
            - **Windows ARM64**: `token-usage-collector-win-arm64.zip`
            - **Linux x64**: `token-usage-collector-linux-x64.tar.gz`
            - **Linux ARM64**: `token-usage-collector-linux-arm64.tar.gz`
            - **macOS Intel**: `token-usage-collector-osx-x64.tar.gz`
            - **macOS Apple Silicon**: `token-usage-collector-osx-arm64.tar.gz`

  build-and-upload:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    needs: create-release

    strategy:
      matrix:
        runtime:
          [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish for ${{ matrix.runtime }}
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish/${{ matrix.runtime }} \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:Version=${{ steps.get_version.outputs.VERSION }}

      - name: Create archive for ${{ matrix.runtime }}
        run: |
          cd ./publish/${{ matrix.runtime }}
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            zip -r ../../token-usage-collector-${{ matrix.runtime }}.zip .
            echo "ASSET_PATH=../../token-usage-collector-${{ matrix.runtime }}.zip" >> $GITHUB_ENV
            echo "ASSET_NAME=token-usage-collector-${{ matrix.runtime }}.zip" >> $GITHUB_ENV
            echo "ASSET_CONTENT_TYPE=application/zip" >> $GITHUB_ENV
          else
            tar -czf ../../token-usage-collector-${{ matrix.runtime }}.tar.gz .
            echo "ASSET_PATH=../../token-usage-collector-${{ matrix.runtime }}.tar.gz" >> $GITHUB_ENV
            echo "ASSET_NAME=token-usage-collector-${{ matrix.runtime }}.tar.gz" >> $GITHUB_ENV
            echo "ASSET_CONTENT_TYPE=application/gzip" >> $GITHUB_ENV
          fi

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.ASSET_PATH }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: ${{ env.ASSET_CONTENT_TYPE }}
